[project]
name = "countess-web"
dynamic = ["version"]
description = "A web browser interface for CountESS, for laptops and HPC clusters"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "countess>=0.1.27,<0.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]
e2e = [
    "pytest-playwright>=0.5",
]

[project.scripts]
countess_web = "countess_web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/countess_web/__init__.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/countess_web"]
# The built front end is not in git; a wheel carries it so a cluster install needs no Node.js.
artifacts = ["src/countess_web/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/countess_web/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Browser tests need the page built and a browser installed; they run with `pytest -m e2e`.
addopts = "--strict-markers -m 'not e2e'"
markers = ["e2e: drives the built page in a browser (needs `npm run build` and `playwright install chromium`)"]

[tool.black]
line-length = 120
