name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # countess-web needs CountESS's workflow names and versions (countess.core.workflow), which are not
  # in a CountESS release yet. Install CountESS from this git ref; change it to a release tag once
  # one has them.
  COUNTESS_REF: feature/workflow-metadata
  NODE_VERSION: "24"

jobs:
  backend:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "countess @ git+https://github.com/CountESS-Project/CountESS@${COUNTESS_REF}"
          pip install -e ".[dev]"
      - name: Test
        run: pytest

  frontend:
    name: Front end (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Checks the generated API types against openapi.json, type-checks, then builds.
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Build the page
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "countess @ git+https://github.com/CountESS-Project/CountESS@${COUNTESS_REF}"
          pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium
      - name: Test
        run: pytest -m e2e --tracing retain-on-failure --output test-results
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
